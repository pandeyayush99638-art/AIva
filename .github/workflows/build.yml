name: Build Aiva APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unzip and build
        run: |
          if [ -f Aiva.zip ]; then unzip -oq Aiva.zip; fi
          cd Aiva
          gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aiva-apk
          path: Aiva/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aiva build ${{ github.run_number }}
          files: Aiva/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
